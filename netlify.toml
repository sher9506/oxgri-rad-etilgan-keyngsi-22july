[[edge_functions]]
function = "blog-seo"
path = "/blog/*"

[[headers]]
for = "/*"

[headers.values]
Permissions-Policy = "camera=(self), microphone=(self)"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
X-Frame-Options = "SAMEORIGIN"
X-Robots-Tag = "index, follow"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; worker-src 'self' blob:;"

[[headers]]
for = "/blog/*"

[headers.values]
X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/sitemap.xml"
to = "https://mrxdoeeyxawcwrndyrwp.supabase.co/functions/v1/sitemap"
status = 200
force = true

[redirects.headers]
Content-Type = "application/xml; charset=utf-8"

[[redirects]]
from = "/*"
to = "https://sher9506-oxgri-rad-e-ipca.bolt.host/:splat"
status = 200

[build]
command = "npm run build"
publish = "dist"